<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR AR Viewer</title>

<script src="https://aframe1.5.0/aframe.min.js
/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#message {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 10px 20px;
  border-radius: 10px;
  font-family: sans-serif;
  z-index: 9999;
}

#startButton {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 28px;
  border: none;
  border-radius: 12px;
  background: #1976d2;
  color: #fff;
  font-size: 18px;
  z-index: 9999;
}
</style>
</head>

<body>

<div id="message">
開始ボタンを押してください
</div>

<button id="startButton">
開始
</button>

<a-scene
id="scene"
mindar-image="imageTargetSrc: targets.mind;"
color-space="sRGB"
renderer="colorManagement: true"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
embedded
>

<a-assets>
./sample05.glb
</a-asset-item>
</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

<a-entity mindar-image-target="targetIndex: 0">
 <a-gltf-model
   src="#model"
   position="0 0 0"
   rotation="0 0 0"
   scale="0.2 0.2 0.2">
 </a-gltf-model>

</a-entity>

</a-scene>

<script>
const scene = document.querySelector("#scene");
const button = document.querySelector("#startButton");
const message = document.querySelector("#message");

button.addEventListener("click", async () => {

  try {

    const arSystem =
      scene.systems["mindar-image-system"];

    await arSystem.start();

    button.style.display = "none";

    message.innerHTML =
      "QRコードにカメラを向けてください";

  } catch(e) {

    console.error(e);

    message.innerHTML =
      "カメラ起動失敗。ブラウザのカメラ許可を確認してください";

  }

});
</script>

</body>
</html>
