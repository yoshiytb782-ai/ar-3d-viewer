<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3D AR Viewer</title>

  <script type="module"
    src=ax/libs/model-viewer/4.3.1/model-viewer.min.js  </script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      padding: 16px;
      background: #222;
      color: white;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background: #ffffff;
    }

    .note {
      padding: 16px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <header>
    <h1>3D AR Viewer</h1>
  </header>

  <model-viewer
    src="models/sample.glb"
    alt="3Dモデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    touch-action="pan-y">
  </model-viewer>

  <div class="note">
    <p>スマートフォンで開くと、対応端末ではAR表示ボタンが表示されます。</p>
  </div>
</body>
</html>
