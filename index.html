<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MindAR QR AR</title>

  aframe.io/releases/1.5.0/aframe.min.js"></script>

  https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #msg {
      position: absolute;
      z-index: 100;
      top: 10px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 5px black;
    }
  </style>
</head>

<body>

<div id="msg">
QRコードにカメラを向けてください
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-assets>

    <a-asset-item
      id="model"
      src="stamp05.glb">
    </a-asset-item>

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model
      src="#model"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.2 0.2 0.2">
    </a-gltf-model>

  </a-entity>
