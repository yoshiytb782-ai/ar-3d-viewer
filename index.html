  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      padding: 16px;
      background: #222;
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .viewer-area {
      position: relative;
      width: 100%;
      height: 70vh;
      background: #ffffff;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    .ar-button {
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .ar-button:active {
      background-color: #0d47a1;
    }

    .note {
      padding: 16px;
      font-size: 16px;
      line-height: 1.6;
    }

    .small {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
